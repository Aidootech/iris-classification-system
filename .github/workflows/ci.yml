name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Dataset, training and export parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r ml/requirements.txt

      - name: Run pytest
        working-directory: ml
        run: python -m pytest

  web:
    name: Typecheck, tests, build and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and parity tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Smoke test the production server
        run: |
          npm run start > /tmp/next-start.log 2>&1 &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run smoke -- http://localhost:3000
          STATUS=$?
          kill $SERVER_PID
          exit $STATUS
